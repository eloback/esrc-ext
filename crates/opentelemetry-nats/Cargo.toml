[package]
name = "opentelemetry-nats"
version = "0.3.1"
description = "Convenience functions for propagating OpenTelemetry traces on NATS messages"
edition = "2024"
authors = ["Eduardo Loback <...>", "Mateus Barbosa <barbosamat16@gmail.com>"]
repository = "https://github.com/eloback/esrc-ext"
license = "MIT"
categories = ["asynchronous", "data-structures", "encoding", "serialization"]

[features]
default = []

[dependencies]
async-nats = "0.46"
opentelemetry = { version = "0.23" }
opentelemetry_sdk = { version = "0.23", features = [
    "trace",
    "logs",
    "rt-tokio",
] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.24" }
